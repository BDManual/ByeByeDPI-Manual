baseURL: /
relativeURLs: true
title: ByeByeDPI

languages:
  en:
    languageName: English
    weight: 2
    title: ByeByeDPI
  ru:
    languageName: Русский
    weight: 1
    title: ByeByeDPI

disableKinds:
  - RSS

module:
  imports:
    - path: github.com/imfing/hextra

defaultContentLanguage: ru

params:
  externalLinkDecoration: true
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: logo.png
      dark: logo-dark.png
      width: 32
      height: 32
  theme:
    default: system
    displayToggle: true
  footer:
    enable: false

menu:
  main:
    - pageRef: /docs/download
      weight: 1
    - pageRef: /docs/01-start
      weight: 2
    - pageRef: /docs/03-features
      weight: 3
    - pageRef: /docs/04-problems
      weight: 4
    - pageRef: /docs/06-extensions
      weight: 5
    - pageRef: /docs/02-tv
      weight: 6
    - pageRef: /docs/07-sbox
      weight: 7
    - pageRef: /docs/05-others
      weight: 8
    - name: Поиск
      weight: 1
      params:
        type: search
    - name: Сменить тему
      params:
        type: theme-toggle
    - name: Сменить язык
      params:
        type: language-switch

markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      unsafe: true

author:
  name: ByeByeDPI
  email: bdman@tutamail.com
