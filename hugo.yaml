baseURL: /
relativeURLs: true
title: ByeByeDPI

languages:
  en:
    languageName: English
    weight: 2
    title: ByeByeDPI
  ru:
    languageName: Русский
    weight: 1
    title: ByeByeDPI

disableKinds:
  - RSS

module:
  imports:
    - path: github.com/imfing/hextra

defaultContentLanguage: ru

params:
  externalLinkDecoration: true
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: logo.png
      dark: logo-dark.png
      width: 32
      height: 32
  theme:
    default: system
    displayToggle: true
  footer:
    enable: false

menu:
  main:
    - pageRef: /docs/download
      weight: 1
    - pageRef: /docs/start
      weight: 2
    - pageRef: /docs/dns
      weight: 3
    - pageRef: /docs/strategies
      weight: 4
    - pageRef: /docs/routing
      weight: 5
    - pageRef: /docs/problems
      weight: 6
    - pageRef: /docs/extensions
      weight: 7
    - pageRef: /docs/tv
      weight: 8
    - pageRef: /docs/sbox
      weight: 9
    - pageRef: /docs/youtube-clients
      weight: 10
    - pageRef: /docs/automation
      weight: 11
    - pageRef: /docs/alternatives
      weight: 12
    - name: Поиск
      weight: 1
      params:
        type: search
    - name: Сменить тему
      params:
        type: theme-toggle
    - name: Сменить язык
      params:
        type: language-switch

markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      unsafe: true

author:
  name: ByeByeDPI
  email: bdman@tutamail.com
